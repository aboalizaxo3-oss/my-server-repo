<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كاوار مزادات</title><style>body{background:#0f172a;color:#e2e8f0;font-family:Arial;margin:0;padding:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.card img{width:100%;max-height:210px;object-fit:cover;border-radius:8px}.row{display:flex;justify-content:space-between;gap:8px;margin:8px 0;flex-wrap:wrap}.btn,input,select{padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}.btn{background:#2563eb;cursor:pointer}.price{color:#4ade80;font-size:20px;font-weight:bold}.muted{color:#94a3b8}</style></head><body><h2>🚗 كاوار مزادات</h2><div class="row"><button class="btn" onclick="loadLots()">🔄 تحديث</button><button class="btn" onclick="fetchNow()">📥 جلب من Copart</button></div><p id="status" class="muted"></p><section id="lots"></section><script>
const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadLots(){try{const d=await api('/api/lots');document.querySelector('#status').textContent=d.lastFetch?'آخر جلب: '+new Date(d.lastFetch).toLocaleString('ar'):(d.error||'لم يتم الجلب بعد');document.querySelector('#lots').innerHTML=d.lots?.length?d.lots.map((l,i)=>`<article class="card">${l.image?`<img src="${esc(l.image)}" loading="lazy" onerror="this.remove()">`:''}<h3>#${i+1} | ${esc(l.year)} ${esc(l.make)} ${esc(l.model)}</h3><div class="muted">لوت: ${esc(l.lot)}</div><p>${esc(l.text).slice(0,180)}</p><div class="price">💰 $${Number(l.bid||0).toLocaleString()}</div><a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">فتح في Copart</a></article>`).join(''):'<div class="card">لا توجد نتائج أو لم يتم إعداد رابط Copart بعد.</div>'}catch(e){document.querySelector('#status').textContent='خطأ: '+e.message}}
async function fetchNow(){document.querySelector('#status').textContent='جارِ الجلب...';try{await api('/api/admin/fetch',{method:'POST'});await loadLots()}catch(e){document.querySelector('#status').textContent='فشل الجلب: '+e.message}}
loadLots();</script></body></html>
